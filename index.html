<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnite Militia – Restoration Tracker</title>
<style>
:root{--bg:#14171a;--card:#1e2226;--line:#2d333a;--tx:#f2f4f6;--mu:#8d97a1;--ac:#2f6fdb;--ac2:#5b9bff;--ok:#3fb27f;--warn:#e0a526;--bad:#e5484d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{display:flex;min-height:100vh}
nav{width:200px;flex:none;background:#101215;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:14px;letter-spacing:.14em;margin:4px 8px 14px;color:var(--ac2)}
nav h1 small{display:block;color:var(--mu);letter-spacing:.05em;font-weight:400;font-size:11px}
nav a{display:block;padding:9px 10px;border-radius:8px;color:var(--mu);cursor:pointer}
nav a.on,nav a:hover{background:var(--card);color:var(--tx)}
nav a.on{box-shadow:inset 3px 0 var(--ac)}
main{flex:1;min-width:0;padding:16px}
h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:15px}h4{margin:0 0 8px}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.top input[type=search]{flex:1;min-width:140px}
input,select,textarea{background:#15181b;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;width:100%}
.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;width:auto}
.b.g{background:#2a3037}.b.x{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:12px}
.card{background:linear-gradient(180deg,#232830,var(--card));border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi{cursor:pointer}.kpi:hover{border-color:var(--ac)}
.kpi b{display:block;font-size:20px}.kpi span,.mu,small{color:var(--mu)}small{display:block;font-size:12px}
.pb{height:8px;background:#2a3037;border-radius:6px;overflow:hidden;margin:4px 0 8px}
.pb i{display:block;height:100%;background:var(--ac)}.pb i.w{background:var(--warn)}.pb i.r{background:var(--bad)}.pb i.o{background:var(--ok)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:12px}
tr[onclick]{cursor:pointer}tr[onclick]:hover{background:#232830}
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;overflow-x:auto}
.col{background:#181b1f;border-radius:10px;padding:8px}
.col h4 span{color:var(--mu);font-weight:400}
.tk{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mu);border-radius:8px;padding:8px;margin-bottom:8px;cursor:pointer}
.tk.p0{border-left-color:var(--bad)}.tk.p1{border-left-color:var(--warn)}.tk.p2{border-left-color:var(--ac)}
em{color:var(--bad);font-style:normal;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
figure{margin:0;background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
figure img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}figcaption{padding:6px 8px;font-size:13px}
.ch{display:flex;align-items:flex-end;gap:6px;height:90px}
.ch div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.ch small{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:min(480px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:#000a}
label{display:block;margin-bottom:8px;font-size:13px;color:var(--mu)}
.row{display:flex;gap:8px;margin-top:10px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#2a3037}
@media(max-width:800px){#app{display:block}nav{width:auto;height:auto;display:flex;overflow-x:auto;padding:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-right:0;border-bottom:1px solid var(--line)}nav h1{display:none}nav a{white-space:nowrap}main{padding:12px}}
.hero{display:flex;align-items:center;gap:16px;padding:10px 16px;background:linear-gradient(90deg,#232830,var(--bg));border-bottom:1px solid var(--line)}.hero img{height:150px;width:auto;max-width:48%;object-fit:contain;border-radius:8px;display:block;flex:none}.hero div{min-width:0}.hero h1{margin:0;font-size:26px;letter-spacing:.14em}.hero p{margin:2px 0 0;color:#c9d1d9;font-size:13px}#wrap{flex:1;min-width:0}
@media(max-width:800px){.hero{gap:10px;padding:8px 12px}.hero img{height:96px}.hero h1{font-size:17px}}
@media print{.hero img{height:100px}}
@media print{nav,.top,.b{display:none}body{background:#fff;color:#000}.card{border-color:#999;background:#fff}}
</style></head><body>

const C={total:['Total',r=>kes(tot(r))],q3:['Req / bought / fitted',r=>`${r.req||0} / ${r.bought||0} / ${r.inst||0}`]};
const MONEY=['cost','price','spent','est'];
let D={},cur='dash',PF='',Q='';
try{D=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
D={veh:{name:'Midnite Militia',make:'Volkswagen',model:'Beetle, 1969',engine:'Toyota 1KR-FE',gearbox:'Original Beetle gearbox (planned)',wheels:'15" 8J ET35, 195/65R15',brakes:'Five-lug disc conversion (planned)'},budget:{},spend:[],tasks:[],parts:[],log:[],journal:[],photos:[],...D};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('Storage is full. Export a backup and remove some photos.')}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kes=n=>'KSh '+Math.round(n||0).toLocaleString('en-KE'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),today=()=>new Date().toISOString().slice(0,10);
const tot=r=>(r.qty===''||r.qty==null?1:+r.qty)*(+r.unit||0),sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const open=t=>!['Completed','Cancelled'].includes(t.status),late=t=>t.due&&t.due<today()&&open(t);
const pct=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0,cls=p=>p>100?'r':p>=80?'w':'';
const bar=(p,c)=>`<div class="pb"><i class="${c||''}" style="width:${Math.min(100,p)}%"></i></div>`;
const go=v=>{cur=v;Q='';render()};
window.edit=(m,id)=>form(m,D[m].find(x=>x.id==id));

function form(mod,rec){
 const m=M[mod],r=rec||{},d=$('#dlg');
 d.innerHTML=`<form id="f" style="padding:16px"><h3>${rec?'Edit':'Add'} ${m.t}</h3>`+m.f.map(([k,l,t,o])=>`<label>${l}`+(t=='sel'?`<select name="${k}">${o.map(x=>`<option${r[k]==x?' selected':''}>${esc(x)}</option>`).join('')}</select>`:t=='area'?`<textarea name="${k}" rows="3">${esc(r[k])}</textarea>`:t=='file'?(rec?'':'<input type="file" name="file" accept="image/*" multiple>'):`<input name="${k}" type="${t=='num'?'number':t}" step="any" value="${esc(r[k]??(t=='date'?today():''))}">`)+'</label>').join('')+`<div class="row"><button class="b">Save</button>${rec?'<button type="button" class="b x" id="del">Delete</button>':''}<button type="button" class="b g" id="cx">Cancel</button></div></form>`;
 $('#cx').onclick=()=>d.close();
 if(rec)$('#del').onclick=()=>{if(confirm('Delete this record permanently?')){D[mod]=D[mod].filter(x=>x!==rec);save();d.close();render()}};
 $('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),o=Object.fromEntries(fd);
  const bad=(m.req||[]).find(k=>!String(o[k]).trim());if(bad)return alert('Please fill in: '+m.f.find(x=>x[0]==bad)[1]);
  if(mod=='photos'&&!rec){const fs=[...e.target.file.files];if(!fs.length)return alert('Choose at least one photo.');delete o.file;for(const f of fs)D.photos.push({id:uid(),...o,src:await shrink(f)})}
  else{if(!rec&&mod=='spend'&&D.spend.some(x=>x.date==o.date&&x.desc==o.desc&&x.unit==o.unit)&&!confirm('A similar expense already exists. Add anyway?'))return;
   if(rec)Object.assign(rec,o);else D[mod].push({id:uid(),...o})}
  save();d.close();render()};
 d.showModal();
}
const shrink=f=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};i.src=fr.result};fr.readAsDataURL(f)});

const lab=(m,c)=>C[c]?C[c][0]:M[m].f.find(x=>x[0]==c)[1].replace(/ \(.*\)/,'');
const cell=(m,r,c)=>C[c]?C[c][1](r):MONEY.includes(c)?kes(r[c]):esc(String(r[c]??'').slice(0,60));
function table(m){
 const rows=[...D[m]].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 return `<div class="top"><button class="b" onclick="form('${m}')">+ Add ${M[m].t}</button><button class="b g" onclick="csv('${m}')">Export CSV</button></div>`+(rows.length?`<div class="sc card"><table><tr>${M[m].c.map(c=>`<th>${lab(m,c)}</th>`).join('')}</tr>${rows.map(r=>`<tr onclick="edit('${m}','${r.id}')">${M[m].c.map(c=>`<td>${cell(m,r,c)}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p class="mu">Nothing recorded yet. Tap + Add to start.</p>');
}
function csv(m){
 const ks=M[m].f.map(x=>x[0]).filter(k=>k!='file'),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 dl(ks.join(',')+'\n'+D[m].map(r=>ks.map(k=>q(r[k])).join(',')).join('\n'),m+'.csv','text/csv');
}
function dl(t,n,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}

const V={};
V.dash=()=>{
 const sp=D.spend,paid=sum(sp.filter(x=>x.status=='Paid'),tot),com=sum(sp.filter(x=>x.status!='Paid'),tot),B=sum(Object.values(D.budget),x=>x),T=D.tasks.filter(x=>x.status!='Cancelled'),dn=T.filter(x=>x.status=='Completed').length,prog=pct(dn,T.length);
 const bycat=CATS.map(c=>[c,sum(sp.filter(x=>x.cat==c),tot)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const kind=k=>sum(sp.filter(x=>x.kind.startsWith(k)),tot),imp=kind('Improvement'),cor=kind('Correction'),mnt=kind('Maintenance');
 const rp=repeats(),rwc=sum(D.log.filter(x=>RW.includes(x.type)),r=>r.cost);
 const nx=D.tasks.filter(open).sort((a,b)=>PR.indexOf(a.pri)-PR.indexOf(b.pri)||(a.due||'9').localeCompare(b.due||'9')).slice(0,5);
 const pend=D.parts.filter(p=>!['Installed','Returned'].includes(p.status));
 const mo={};sp.filter(x=>x.status=='Paid').forEach(x=>{const k=(x.date||'').slice(0,7);if(k)mo[k]=(mo[k]||0)+tot(x)});
 const ms=Object.entries(mo).sort().slice(-6),mx=Math.max(1,...ms.map(x=>x[1]));
 const k=(l,v,to,sub)=>`<div class="card kpi" onclick="go('${to}')"><span>${l}</span><b>${v}</b>${sub||''}</div>`;
 return `<h2>MIDNITE MILITIA – PROJECT STATUS</h2><p class="mu">${esc(D.veh.model)} · ${esc(D.veh.engine)}</p>
 <div class="grid">${k('Overall progress',prog+'%','tasks',bar(prog,'o'))}${k('Budget',kes(B),'budget')}${k('Spent',kes(paid),'spend')}${k('Committed, unpaid',kes(com),'spend')}${k('Remaining',kes(B-paid-com),'budget',bar(pct(paid+com,B),cls(pct(paid+com,B))))}${k('Open tasks',D.tasks.filter(open).length,'tasks',`<small>${D.tasks.filter(late).length} overdue</small>`)}${k('Parts outstanding',pend.length,'parts')}${k('Rework spend',kes(rwc),'log',`<small>${rp.length} repeated activities</small>`)}</div>
 <div class="g2"><div class="card"><h3>Next five recommended actions</h3>${nx.map(t=>`<div onclick="edit('tasks','${t.id}')" style="cursor:pointer;margin-bottom:6px"><b>${esc(t.title)}</b> <span class="tag">${t.pri}</span>${late(t)?' <em>overdue</em>':''}<small>${esc(t.status)}${t.due?' · due '+t.due:''}</small></div>`).join('')||'<p class="mu">Add tasks to get recommendations. Critical and overdue work rises to the top; you decide what actually gets done.</p>'}</div>
 <div class="card"><h3>Improvement vs correction spend</h3>${[['Improvement',imp,'o'],['Correction',cor,'r'],['Maintenance',mnt,'']].map(([l,v,c])=>`<small>${l}: ${kes(v)}</small>${bar(pct(v,imp+cor+mnt),c)}`).join('')}<small>Correction is money spent fixing earlier mistakes.</small></div>
 <div class="card"><h3>Most expensive categories</h3>${bycat.map(([c,v])=>`<small>${c}: ${kes(v)}</small>${bar(pct(v,bycat[0][1]))}`).join('')||'<p class="mu">No spending yet.</p>'}</div>
 <div class="card"><h3>Monthly spend (paid)</h3>${ms.length?`<div class="ch" style="margin-bottom:18px">${ms.map(([m,v])=>`<div style="height:${pct(v,mx)}%" title="${kes(v)}"><small>${m.slice(2)}</small></div>`).join('')}</div>`:'<p class="mu">No data yet.</p>'}</div>
 <div class="card"><h3>Subsystem progress</h3>${CATS.map(c=>{const t=T.filter(x=>x.sub==c);return t.length?`<small>${c}: ${t.filter(x=>x.status=='Completed').length}/${t.length}</small>${bar(pct(t.filter(x=>x.status=='Completed').length,t.length),'o')}`:''}).join('')||'<p class="mu">Each subsystem fills in from its completed tasks.</p>'}</div>
 <div class="card"><h3>Recurring issues needing a permanent fix</h3>${rp.filter(r=>r.open).map(r=>`<div><b>${esc(r.name)}</b> ×${r.n} <small>${kes(r.cost)} spent · last outcome not resolved</small></div>`).join('')||'<p class="mu">None flagged.</p>'}</div>
 <div class="card"><h3>Latest photos</h3><div class="gal">${[...D.photos].reverse().slice(0,4).map(p=>`<figure onclick="go('photos')"><img src="${p.src}"></figure>`).join('')||'<p class="mu">No photos yet.</p>'}</div></div>
 <div class="card"><h3>Latest notes</h3>${[...D.journal].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(j=>`<div><small>${j.date}</small>${esc(j.done).slice(0,120)}</div>`).join('')||'<p class="mu">No journal entries yet.</p>'}</div></div>`;
};
function repeats(){
 const g={};D.log.forEach(r=>{const k=r.act.trim().toLowerCase();(g[k]=g[k]||[]).push(r)});
 return Object.values(g).filter(a=>a.length>1).map(a=>{a.sort((x,y)=>x.date.localeCompare(y.date));return{name:a[0].act,n:a.length,cost:sum(a,r=>r.cost),hrs:sum(a,r=>r.hrs),rw:a.filter(r=>RW.includes(r.type)).length,open:a[a.length-1].outcome!='Resolved',sub:a[0].sub}}).sort((a,b)=>b.cost-a.cost);
}
V.tasks=()=>`<h2>Pending work & next actions</h2><div class="top"><button class="b" onclick="form('tasks')">+ Add task</button><button class="b g" onclick="csv('tasks')">Export CSV</button></div><div class="kan">`+Object.entries(COLS).map(([n,ss])=>{
 const l=D.tasks.filter(x=>ss.includes(x.status)).sort((a,b)=>PR.indexOf(a.pri)-PR.indexOf(b.pri));
 return `<div class="col"><h4>${n} <span>${l.length}</span></h4>${l.map(x=>`<div class="tk p${PR.indexOf(x.pri)}" onclick="edit('tasks','${x.id}')"><b>${esc(x.title)}</b><small>${esc(x.sub)} · ${x.pri}${x.due?' · due '+x.due:''}${late(x)?' · <em>OVERDUE</em>':''}</small><small>${esc(x.status)}${x.est?' · est '+kes(x.est):''}</small></div>`).join('')}</div>`}).join('')+'</div>';
V.spend=()=>`<h2>Spending</h2>${table('spend')}`;
V.parts=()=>`<h2>Parts & procurement</h2>${table('parts')}<p class="mu">Rows where fitted &lt; required show as outstanding on the dashboard.</p>`;
V.log=()=>{
 const rp=repeats(),rw=D.log.filter(x=>RW.includes(x.type));
 return `<h2>Work log & repeated work</h2><div class="grid"><div class="card"><span>Rework cost</span><b>${kes(sum(rw,r=>r.cost))}</b></div><div class="card"><span>Rework hours</span><b>${sum(rw,r=>r.hrs)}</b></div><div class="card"><span>Repeated activities</span><b>${rp.length}</b></div></div>
 ${rp.length?`<div class="card sc" style="margin-bottom:12px"><h3>Repeated activities (matched by activity name)</h3><table><tr><th>Activity</th><th>Times</th><th>Cost</th><th>Hours</th><th>Rework</th><th>Status</th></tr>${rp.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.n}</td><td>${kes(r.cost)}</td><td>${r.hrs}</td><td>${r.rw}</td><td>${r.open?'<em>No confirmed fix</em>':'Resolved'}</td></tr>`).join('')}</table><small>Routine servicing that repeats is normal; only rework types count as problems.</small></div>`:''}
 ${table('log')}`;
};
V.journal=()=>`<h2>Project journal</h2>${table('journal')}`;
V.photos=()=>`<h2>Photo gallery</h2><div class="top"><button class="b" onclick="form('photos')">+ Add photos</button><select onchange="PF=this.value;render()" style="width:auto"><option value="">All albums</option>${AL.map(a=>`<option${PF==a?' selected':''}>${a}</option>`).join('')}</select></div><div class="gal">${D.photos.filter(p=>!PF||p.album==PF).sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<figure onclick="edit('photos','${p.id}')"><img src="${p.src}"><figcaption>${esc(p.caption)||'—'}<small>${p.date} · ${esc(p.album)} · ${esc(p.stage)}</small></figcaption></figure>`).join('')||'<p class="mu">No photos yet. Tag before / during / after shots to build the visual record.</p>'}</div>`;
V.budget=()=>{
 const sp=D.spend;
 return `<h2>Budgets</h2><div class="card">${CATS.map((c,i)=>{const s=sum(sp.filter(x=>x.cat==c),tot),b=+D.budget[c]||0,p=pct(s,b);return `<div class="row" style="align-items:center"><div style="flex:1"><b>${c}</b><small>${kes(s)} of ${kes(b)}${b&&s>b?' · <em>OVER</em>':b&&p>=80?' · nearing limit':''}</small>${bar(b?s/b*100:0,cls(b?s/b*100:0))}</div><input type="number" style="width:130px" placeholder="Budget" value="${b||''}" onchange="D.budget['${c}']=+this.value;save();render()"></div>`}).join('')}</div>`;
};
V.veh=()=>`<h2>Vehicle & data</h2><div class="card">${VF.map(([k,l])=>`<label>${l}<input value="${esc(D.veh[k])}" onchange="D.veh['${k}']=this.value;save()"></label>`).join('')}</div>
 <div class="card" style="margin-top:12px"><h3>Backup</h3><div class="row"><button class="b" onclick="dl(JSON.stringify(D),'midnite-militia-backup-'+today()+'.json','application/json')">Export backup</button><label class="b g" style="margin:0;color:#fff">Restore<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label><button class="b g" onclick="print()">Print</button></div><small>Data lives in this browser only. Export a backup regularly, especially before clearing browser data.</small></div>`;
V.search=()=>{
 const q=Q.toLowerCase(),out=[];
 Object.keys(M).forEach(m=>D[m].forEach(r=>{if(Object.entries(r).filter(([k])=>k!='src'&&k!='id').map(x=>x[1]).join(' ').toLowerCase().includes(q))out.push(`<div class="card" style="margin-bottom:8px;cursor:pointer" onclick="edit('${m}','${r.id}')"><span class="tag">${m}</span> ${esc(r.title||r.desc||r.name||r.act||r.done||r.caption||'')}</div>`)}));
 return `<h2>Search: ${esc(Q)}</h2>${out.join('')||'<p class="mu">No matches.</p>'}`;
};
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.veh)throw 0;if(confirm('Replace all current data with this backup?')){D=o;save();render()}}catch(e){alert('That file is not a valid backup.')}};r.readAsText(f)}
const NAV=[['dash','Dashboard'],['tasks','Pending work'],['spend','Spending'],['budget','Budgets'],['parts','Parts'],['log','Work log'],['photos','Photos'],['journal','Journal'],['veh','Vehicle & data']];
function render(){
 $('#nav').innerHTML='<h1>MIDNITE MILITIA<small>Restomod tracker</small></h1>'+NAV.map(([k,l])=>`<a class="${k==cur?'on':''}" onclick="go('${k}')">${l}</a>`).join('');
 $('#main').innerHTML=`<div class="top"><input type="search" placeholder="Search everything…" value="${esc(Q)}" id="q"></div>`+V[cur]();
 const q=$('#q');q.oninput=()=>{Q=q.value;cur=Q?'search':'dash';render();const n=$('#q');n.focus();n.setSelectionRange(Q.length,Q.length)};
}
render();
</script></body></html>
